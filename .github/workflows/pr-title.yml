name: Lint PR Title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened

permissions:
  contents: read
  # The action reports a rejected title by posting a comment on the pull request, which
  # needs write access. Without it the job fails with a 403 instead of explaining why.
  pull-requests: write

jobs:
  validate:
    name: Validate PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The PR title subject must not start with an uppercase letter to follow Conventional Commits standard.
